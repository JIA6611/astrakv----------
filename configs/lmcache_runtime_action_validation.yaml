# Shared runtime-action validation topology.
# Store objects on SSD first so the prefetch scenario starts from a released
# disk object, while keeping a real CPU hot-cache target available.

local_cpu: true
max_local_cpu_size: 4.0
local_disk: results/lmcache_runtime_action_validation_store
max_local_disk_size: 40.0
store_location: LocalDiskBackend

run_name: stress_vllm_memory_constrained

backend:
  name: vllm_openai_stress
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: /home/szl/Desktop/Inference-OS/models/Qwen2.5-7B-Instruct
  timeout_seconds: 900

server:
  host: 127.0.0.1
  port: 8000
  dtype: auto
  gpu_memory_utilization: 0.60
  max_model_len: 8192
  tensor_parallel_size: 1
  trust_remote_code: true

matrix:
  # P0-7 memory-constrained stress matrix. Start with the smoke override in
  # GPU_VALIDATION_P0_7.md before running this full matrix.
  batch_sizes: [1, 2, 4]
  context_lengths: [2048, 4096, 6144, 8192]
  output_tokens: 64
  repeat: 3

workload:
  system_prompt: "You are a concise assistant for systems research stress tests."
  prompt_seed: "AstraKV-W memory-constrained vLLM stress benchmark."
  prompt_token_scale: 0.70
  temperature: 0.0
  top_p: 1.0

metrics:
  sample_interval_seconds: 0.5
  disk_device: ""
  process_name_filters: ["vllm", "python"]

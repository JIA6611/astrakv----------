run_name: astrakv_real_workload_suite

description: >
  Fixed competition workload suite for endpoint quality and memory-behavior
  validation. The prompt JSONL is generated by scripts/generate_workload_suite.py.

prompts:
  path: benchmarks/prompts/competition_workload_suite.jsonl
  schema: astra-workload-suite-v1

endpoint_evaluation:
  baseline_base_url: http://127.0.0.1:8000
  variant_base_url: http://127.0.0.1:8001
  model: Qwen/Qwen2.5-7B-Instruct
  temperature: 0.0
  top_p: 1.0
  max_tokens: 128

workload_types:
  - short_chat
  - long_context_qa
  - prefix_reuse
  - rag_repeated_prefix
  - memory_pressure

metrics:
  - TTFT
  - TPOT
  - Latency
  - Throughput
  - GPU Memory
  - CPU Memory
  - SSD Traffic
  - KV Hit Rate
  - Prefetch Hit Rate
  - Exact Match Rate
  - Token Divergence Rate
  - PPL when available

usage:
  generate: >
    python scripts/generate_workload_suite.py
    --output-dir benchmarks/prompts
  quality: >
    python scripts/evaluate_quality.py
    --prompts benchmarks/prompts/competition_workload_suite.jsonl
    --baseline-base-url http://127.0.0.1:8000
    --variant-base-url http://127.0.0.1:8001
    --output-dir results/p1_8_quality_suite

notes:
  - This config describes workload assets only; it does not launch endpoints.
  - Keep the generated JSONL fixed for official baseline/variant comparisons.

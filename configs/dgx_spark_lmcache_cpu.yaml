run_name: real_lmcache_cpu_qwen3_8b
require_canonical_workload: true
workload_jsonl: ""

backend:
  name: vllm_lmcache_cpu
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: /opt/models/Qwen3-8B
  fallback_model: /opt/models/Qwen2.5-7B-Instruct
  timeout_seconds: 600

server:
  host: 127.0.0.1
  port: 8000
  dtype: auto
  gpu_memory_utilization: 0.72
  max_model_len: 32768
  tensor_parallel_size: 1
  trust_remote_code: true

lmcache:
  enabled: true
  backend: cpu
  config_file: configs/lmcache_cpu_example.yaml
  kv_transfer_config:
    kv_connector: LMCacheConnectorV1
    kv_role: kv_both
  note: "Verify the installed LMCache/vLLM versions accept LMCacheConnectorV1 before official runs."

matrix:
  # P0-2 CPU-tier baseline matrix. Keep this aligned with the vLLM-only P0-1
  # matrix so reports can compare baseline and LMCache CPU under the same load.
  # Override these values from the CLI for quick smoke tests.
  batch_sizes: [1, 2, 4]
  context_lengths: [512, 1024, 2048, 4096, 8192]
  output_tokens: 64
  repeat: 5

workload:
  system_prompt: "You are a concise assistant for systems research experiments."
  prompt_seed: "AstraKV-W evaluates CPU-tier KV offload for memory-constrained inference."
  prompt_token_scale: 0.75
  temperature: 0.0
  top_p: 1.0

metrics:
  sample_interval_seconds: 0.5
  disk_device: ""
  process_name_filters: ["vllm", "lmcache", "python"]

disk_io:
  scratch_file_mb: 64
  block_mb: 4
